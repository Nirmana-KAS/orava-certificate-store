<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">System architecture</title><desc id="d">Browser talks to Next.js on Vercel, which uses Supabase Postgres and Storage and sends email. cron-job.org calls the health API.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a75b1"/></marker></defs>
  <rect width="1200" height="460" rx="22" fill="#f6f9fd"/>
  <text x="600" y="40" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#1b2a3b">How the pieces fit together</text>
  <rect x="300" y="70" width="620" height="270" rx="20" fill="#eaf2fb" stroke="#bcd0e8" stroke-dasharray="6 6"/>
  <text x="320" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#2d5f95">VERCEL (free)</text>
