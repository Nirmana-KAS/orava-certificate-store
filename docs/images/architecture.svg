    <text x="125.0" y="53.0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4a5a6d">checks every part</text></g>
  <g transform="translate(640,115)"><rect width="250" height="90" rx="14" fill="#fff" stroke="#3a75b1" stroke-width="2"/>
    <text x="125.0" y="41.0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1b2a3b">Server only code</text>
    <text x="125.0" y="63.0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4a5a6d">sessions, rate limits, audit</text></g>

