    <text x="100.0" y="63.0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4a5a6d">phone, tablet, desktop</text></g>
  <g transform="translate(340,120)"><rect width="230" height="70" rx="14" fill="#fff" stroke="#3a75b1" stroke-width="2"/>
    <text x="115.0" y="31.0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1b2a3b">proxy.ts</text>
    <text x="115.0" y="53.0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4a5a6d">sign-in gate + CSP</text></g>
  <g transform="translate(340,230)"><rect width="230" height="90" rx="14" fill="#fff" stroke="#3a75b1" stroke-width="2"/>
    <text x="115.0" y="41.0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1b2a3b">Next.js 16 app</text>
    <text x="115.0" y="63.0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4a5a6d">pages + server actions</text></g>
