# Keeps every dependency on its latest stable release (PLAN.md §2 version policy).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      testing:
        patterns: ["vitest", "@playwright/*", "@axe-core/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
